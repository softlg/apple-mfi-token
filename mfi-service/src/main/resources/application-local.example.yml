# 本地开发覆盖配置示例。
# 复制为 application-local.yml 后填入真实值；application-local.yml 已在 .gitignore 中，永不入库。
# 启动：mvn -pl mfi-service spring-boot:run -Dspring-boot.run.profiles=local
# 本文件只给键名与形状，真实账号口令一律不写进仓库。

spring:
  datasource:
    # createDatabaseIfNotExist 便于空库首次启动，连接账号需有 CREATE 权限
    url: jdbc:mysql://127.0.0.1:3306/apple_mfi_token?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: CHANGE_ME
    password: CHANGE_ME

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0

  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: CHANGE_ME
    password: CHANGE_ME
